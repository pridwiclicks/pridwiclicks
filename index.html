<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<title>pridwiclicks</title>
    <link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0d0d0d;
color:white;
font-family: 'Poppins', sans-serif;
}

header{
    min-height:70vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:
        linear-gradient(rgba(0,0,0,0.45),rgba(0,0,0,0.45)),
        url("IMG_20260717_145119892 (1).jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    padding:40px 20px;
}

h1{
    font-size:52px;
    letter-spacing:5px;
}

p{
    margin-top:20px;
    font-size:18px;
    color:#cfcfcf;
}

.gallery{
    padding:60px 20px;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.gallery h2{
    text-align:center;
    font-size:38px;
    margin-bottom:30px;
}

.gallery h3{
    margin:0 0 10px;
    font-size:24px;
}

.photo{
    width:100%;
    max-width:900px;
    height:auto;
    margin:0 auto;
    background:#222;
    border-radius:12px;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

.photo img{
    display:block;
    width:100%;
    height:auto;
    max-width:100%;
    object-fit:contain;
}

footer{
    position:relative;
    text-align:center;
    padding:40px 20px;
    color:#777;
    font-size:14px;
    line-height:1.8;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

header h1,
header p {
    animation: fadeIn 1.5s ease;
}.

@keyframes bounce{
    0%,20%,50%,80%,100%{
        transform:translateX(-50%) translateY(0);
    }
    40%{
        transform:translateX(-50%) translateY(-10px);
    }
    60%{
        transform:translateX(-50%) translateY(-5px);
    }
}</style>
<script src="https://cdn-in.pagesense.io/js/pridwiclicks/b34872ce6e664990a09214373545979b.js"></script>
</head>

<body>

<nav>

<a href="#">Home</a>

<a href="#">Gallery</a>

<a href="#">About</a>

<a href="#">Contact</a>

</nav>

<header>

<h1>pridwiclicks</h1>

<p>Frames from the world around me</p>

</header>

<section class="gallery">

<h2>Gallery</h2>

<h3>⭐ signature</h3>
<div class="photo">
    <img src="the-sentinel.jpg" alt="The Sentinel">
</div>

<h3>👁 The gaze</h3>
<div class="photo">
    <img src="the-sentinel.jpg" alt="The Sentinel">
</div>

</section>

<footer>
    <p>© 2026 pridwiclicks. All Rights Reserved.</p>
    <p>Captured by pridwi.</p>
</footer>
<script>
document.querySelectorAll("img").forEach(img => {
    img.setAttribute("draggable", "false");

    img.addEventListener("contextmenu", function(e) {
        e.preventDefault();
    });
});
</script>

</body>
</html>
