<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pridwiclicks</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0d0d0d;
color:white;
font-family:Arial, Helvetica, sans-serif;
}

header{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
    url("IMG_20260717_145119892 (1).jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;}

h1{
font-size:60px;
letter-spacing:5px;
}

p{
margin-top:20px;
font-size:18px;
color:#cfcfcf;
}

nav{
position:fixed;
top:0;
width:100%;
padding:18px;
background:#111;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:20px;
font-size:16px;
}

.gallery{
padding:80px 20px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.photo{
height:260px;
background:#222;
border-radius:12px;
display:flex;
justify-content:center;
align-items:center;
color:#888;
font-size:18px;
}

footer{
text-align:center;
padding:40px;
color:#777;
}

</style>

</head>

<body>

<nav>

<a href="#">Home</a>

<a href="#">Gallery</a>

<a href="#">About</a>

<a href="#">Contact</a>

</nav>

<header>

<h1>pridwiclicks</h1>

<p>Frames from the world around me</p>

</header>

<section class="gallery">

<div class="photo">Photo 1</div>

<div class="photo">Photo 2</div>

<div class="photo">Photo 3</div>

<div class="photo">Photo 4</div>

</section>

<footer>

© pridwiclicks

</footer>

</body>
</html>
